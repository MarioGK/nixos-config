# SOPS configuration for secrets management
#
# Setup instructions:
# 1. Generate an age key from your SSH host key:
#    ssh-keygen -t ed25519 -C "nixos@mariogk-notebook" -f ~/.ssh/id_ed25519_sops
#    # Or use existing SSH key
#
# 2. Get the age public key:
#    nix-shell -p ssh-to-age --run "cat ~/.ssh/id_ed25519.pub | ssh-to-age"
#
# 3. Replace the placeholder key below with your actual public key
#
# 4. Create secrets:
#    sops secrets/secrets.yaml

keys:
  # Age keys derived from SSH keys
  - &mariogk-notebook age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *mariogk-notebook
